name: Feature request
description: Propose a capability the plugin does not have yet
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do that the plugin makes hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to happen
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including doing nothing, or using another plugin alongside this one
    validations:
      required: false
  - type: checkboxes
    id: constraints
    attributes:
      label: Project constraints
      description: This project has no build step and no runtime dependencies (see AGENTS.md)
      options:
        - label: This can be done without adding a dependency, a bundler or a build step
          required: true
        - label: I understand the plugin keeps one write path shared by the panel and the agent tools
          required: false
