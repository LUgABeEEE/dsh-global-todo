name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: verify (node ${{ matrix.node }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is not a courtesy matrix entry: the atomic write, the rename retry and
        # the path rules all behave differently there, and issue #2 shipped for months
        # because only Linux was ever exercised.
        os: [ubuntu-latest, windows-latest]
        node: ['22.19.0', '24.x']
        exclude:
          # One Windows node is enough; the platform, not the runtime, is what varies.
          - os: windows-latest
            node: '24.x'
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          # The plugin has no dependencies and no lockfile, so there is nothing to cache.
          # setup-node v5+ would turn caching on by itself the day a `packageManager`
          # field appears in package.json, and then fail for the missing lockfile.
          package-manager-cache: false

      # The plugin has no dependencies: there is nothing to install and nothing
      # to build. `npm ci` would fail without a lockfile, so it is not used.
      - name: Static checks
        run: npm run check

      - name: Tests
        run: npm test
        # A file watcher can hold a handle on Windows for a moment; the tests write in
        # their own temp directories, so a retry is safe and keeps CI honest.
        continue-on-error: false

      - name: Package shape
        run: npm pack --dry-run

      - name: Windows-only smoke (real filesystem)
        if: runner.os == 'Windows'
        run: node tools/windows-check.mjs
