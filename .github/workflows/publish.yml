name: Publish

# Trusted Publishing: the OIDC token below replaces a long-lived npm token. The
# package has to name this repository *and* this workflow file in its npm
# settings before the first run, otherwise `npm publish` has no identity to use.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for OIDC: without it npm cannot prove where the publish came from.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org

      # `prepack` already runs `npm run verify`, so this is belt and braces — and
      # it fails the release long before the registry sees anything.
      - name: Verify
        run: npm run verify

      - name: Publish with provenance
        run: npm publish --provenance --access public
