name: Publish

# Trusted Publishing: the OIDC token below replaces a long-lived npm token. The
# package has to name this repository *and* this workflow file in its npm
# settings before the first run, otherwise `npm publish` has no identity to use.
#
# npm refuses to configure a trusted publisher for a package that does not exist
# yet — "Package must exist" is a documented prerequisite of `npm trust` — so the
# very first release was published by hand from a checkout. Every release after
# it comes from here, with no token anywhere.
on:
  workflow_dispatch:
    inputs:
      # The cadence gate below is a distribution rule, not a correctness one, so it needs a
      # documented way out: a data-loss or security fix ships the moment it is ready, and a
      # retried publish must be able to run again after a failure.
      force:
        description: 'Publish even if the cadence check says hold (data-loss/security fix, or retrying a failed publish)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read
  # Required for OIDC: without it npm cannot prove where the publish came from.
  id-token: write

jobs:
  publish:
    # This file is mirrored into the private backup repository, and a fork carries
    # it too. Publishing is only ever legitimate from the canonical public one: npm
    # registers that repository as the trusted publisher, and any other checkout has
    # no OIDC identity to present — it would spend a minute building the package and
    # then die with `E404`, which is exactly what nine tag pushes to the backup did
    # before this guard. Skipped, not failed, so a mirror never shows a red X.
    if: github.repository == 'LUgABeEEE/dsh-global-todo'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22.19.0'
          registry-url: https://registry.npmjs.org
          # No lockfile and no dependencies: caching would have nothing to key on.
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later, and Node 22.19 ships npm
      # 10.9.3 — the publish would fail with ENEEDAUTH however correct the OIDC
      # setup is. Pin the floor, not a major, so a fix can still arrive.
      - name: Install an npm that speaks OIDC
        run: npm install --global npm@^11.5.1

      # `prepack` already runs `npm run verify`, so this is belt and braces — and
      # it fails the release long before the registry sees anything.
      - name: Verify
        run: npm run verify

      # One release a day. Every catalog a reader browses rebuilds daily and the market pins
      # the version it lists, so a second release in the same day is invisible to the people
      # it was meant for — and it multiplies the "new versions" that automated fetchers pull.
      # The check reads npm's own publish times, not the tag: a release that failed to publish
      # never reached the registry, and the tag alone would understate the gap.
      - name: Check the release cadence
        if: inputs.force != true
        run: node tools/release-check.mjs --registry

      - name: Publish with provenance
        run: npm publish --provenance --access public
